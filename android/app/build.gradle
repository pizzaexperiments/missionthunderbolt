plugins { id 'com.android.application' }
android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace 'org.missionthunderbolt.prototype'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        applicationId 'org.missionthunderbolt.prototype'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-research'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

// Review evidence for packaged dependencies; build-tool classpaths are separate.
tasks.register('exportReleaseRuntimeDependencies') {
    doLast {
        def resolved = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
            .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .collect { it.id.displayName }.sort()
        def output = layout.buildDirectory.file('reports/release-runtime-dependencies.json').get().asFile
        def artifacts = configurations.releaseRuntimeClasspath.incoming.artifacts.artifacts
            .collect { it.id.displayName }.sort()
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
            [schema: 1, configuration: 'releaseRuntimeClasspath', modules: resolved, artifacts: artifacts])) + '\n'
    }
}
