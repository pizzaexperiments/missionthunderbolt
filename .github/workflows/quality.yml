# Deliberately manual-only; no Actions credits spent on push/PR.
name: Manual sanitizers and synthetic parser mutations
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.10.7
      - name: Synthetic parser coverage gate
        env:
          COVERAGE_FILE: ${{ github.workspace }}/dist/coverage/.coverage
        run: |
          mkdir -p dist/coverage
          python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage combine
          python -m coverage report
          python -m coverage xml -o dist/coverage/coverage.xml
      - run: cmake -S . -B dist/sanitizers -DCMAKE_BUILD_TYPE=Debug -DMT_ENABLE_SANITIZERS=ON
      - run: cmake --build dist/sanitizers --parallel 4
      - run: ctest --test-dir dist/sanitizers --output-on-failure
